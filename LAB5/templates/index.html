<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Показания счётчиков газа</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        a.btn { display: inline-block; margin: 10px 0; padding: 8px 16px;
                background: #4a90e2; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Показания приборов учёта газа</h1>
    <a class="btn" href="/gasapp/add/">Добавить показание</a>
    <table>
        <tr>
            <th>Номер счётчика</th>
            <th>Дата</th>
            <th>Показание, м³</th>
            <th>Комментарий</th>
        </tr>
        {% for r in readings %}
        <tr>
            <td>{{ r.meter_number }}</td>
            <td>{{ r.reading_date }}</td>
            <td>{{ r.value }}</td>
            <td>{{ r.comment }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Пока нет внесённых показаний</td></tr>
        {% endfor %}
    </table>
</body>
</html>
